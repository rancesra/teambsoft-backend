# Levanta el microservicio con sus dos dependencias. Para desarrollo del día a día basta con
# "docker compose up -d mongo rabbitmq" y correr la aplicación desde VS Code.

services:
  mongo:
    image: mongo:7.0
    container_name: catalogo-mongo
    ports:
      # Solo a 127.0.0.1: la base no queda expuesta a la red de la universidad.
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-datos:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: catalogo-rabbit
    hostname: catalogo-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
    # Sin esto, en algunas versiones de Docker el contenedor arranca como root, Erlang escribe su
    # cookie con permisos de root y el proceso, que corre como rabbitmq, no la puede leer.
    user: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit-datos:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalogo:
    build: .
    container_name: catalogo-servicio
    ports:
      - "8080:8080"
    environment:
      # Dentro de la red de Docker, los servicios se llaman por su nombre, no por localhost:
      # "localhost" dentro de un contenedor es ese mismo contenedor.
      SPRING_MONGODB_URI: mongodb://mongo:27017/catalogo
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?Define RABBITMQ_USER en .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
      EUREKA_CLIENT_ENABLED: "false"
      # v2.5: la llave pública de Keycloak se descarga por la red de Docker; el emisor ("iss") sigue
      # siendo localhost:8180, porque es la dirección con la que el navegador pidió el token.
      KEYCLOAK_LLAVES: http://keycloak:8080/realms/tienda/protocol/openid-connect/certs
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # --- Identidad (v2.5) -----------------------------------------------------------------------
  # Keycloak emite los tokens con los que se inicia sesión. Al arrancar importa el realm "tienda"
  # de keycloak/realm-tienda.json: los roles admin y cliente, el cliente tienda-web del navegador y
  # dos usuarios de prueba. No guarda nada entre reinicios: cada arranque vuelve a ese estado.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: catalogo-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      # Usuario de la consola de administración (http://localhost:8180/admin). Solo desarrollo.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # El emisor de los tokens queda fijo en la dirección del navegador, aunque un servicio llegue
      # por http://keycloak:8080. Sin esto, el "iss" cambiaría según quién pregunte.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      # La imagen no trae curl: se pregunta por el puerto de administración (9000) con bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --- Infraestructura del ecosistema ---------------------------------------------------------
  # Kong es la única puerta de entrada al sistema: todo el tráfico del cliente pasa por aquí.
  # Ojo: es infraestructura COMPARTIDA con los equipos A y C. Está aquí para poder desarrollar y
  # probar Catálogo solo; cuando se decida quién opera el Kong del sistema, esto se mueve allá.
  kong:
    image: kong:3.9
    container_name: catalogo-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong:/kong:ro
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    depends_on:
      catalogo:
        condition: service_healthy

volumes:
  mongo-datos:
  rabbit-datos:
