spring:
  application:
    # Nombre del servicio. Con este nombre se registrará en Eureka.
    name: catalogo
  mongodb:
    # Conexión a MongoDB. En Boot 4 va en spring.mongodb (en Boot 3 era spring.data.mongodb).
    # Dentro de Docker se puede reemplazar con la variable de entorno SPRING_MONGODB_URI.
    uri: mongodb://localhost:27017/catalogo
  data:
    mongodb:
      # Crea al arrancar los índices declarados en las entidades (@CompoundIndex de Producto).
      auto-index-creation: true
      representation:
        # Guarda los BigDecimal (el precio) como Decimal128, el decimal exacto de MongoDB.
        # Desde Spring Data MongoDB 5 no hay valor por defecto: sin esta línea, guardar un precio falla.
        big-decimal: decimal128

server:
  port: 8080

management:
  endpoint:
    health:
      # Muestra en /actuator/health el estado de cada componente (por ejemplo, mongo).
      # Útil en desarrollo; hay que restringirlo antes de exponer el servicio a través de Kong.
      show-details: always