spring:
  application:
    # Nombre del servicio. Con este nombre se registrará en Eureka.
    name: catalogo
  mongodb:
    # Conexión a MongoDB. En Boot 4 va en spring.mongodb (en Boot 3 era spring.data.mongodb).
    # Dentro de Docker se puede reemplazar con la variable de entorno SPRING_MONGODB_URI.
    uri: mongodb://localhost:27017/catalogo
  data:
    mongodb:
      # Crea al arrancar los índices declarados en las entidades (@CompoundIndex de Producto).
      auto-index-creation: true
      representation:
        # Guarda los BigDecimal (el precio) como Decimal128, el decimal exacto de MongoDB.
        # Desde Spring Data MongoDB 5 no hay valor por defecto: sin esta línea, guardar un precio falla.
        big-decimal: decimal128
  rabbitmq:
    # Bus de eventos. Dentro de Docker el host es el nombre del servicio (rabbitmq), no localhost:
    # se cambia con la variable de entorno SPRING_RABBITMQ_HOST.
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8080

eureka:
  client:
    # El estado que ve Eureka sale de /actuator/health: si Catálogo pierde MongoDB o RabbitMQ, en el
    # registro aparece DOWN y no UP, aunque el proceso siga corriendo.
    healthcheck:
      enabled: true
    service-url:
      # Dónde vive el registro. Dentro de Docker es el nombre del servicio; se cambia con la
      # variable de entorno EUREKA_CLIENT_SERVICEURL_DEFAULTZONE.
      defaultZone: http://localhost:8761/eureka/
  instance:
    # Se anuncia por IP y no por el nombre de la máquina: dentro de Docker el hostname es un
    # identificador que nadie más puede resolver.
    prefer-ip-address: true
    # Cada 10 segundos le confirma a Eureka que sigue vivo; si pasan 30 sin noticias, Eureka lo saca
    # del registro. Con los valores de fábrica (30 y 90), un servicio caído sigue anunciado un
    # minuto y medio.
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoint:
    health:
      # Muestra en /actuator/health el estado de cada componente (por ejemplo, mongo).
      # Útil en desarrollo; hay que restringirlo antes de exponer el servicio a través de Kong.
      show-details: always
# v2.5: Catálogo valida los tokens que emite Keycloak (contrato, sección 2).
#  - issuer-uri: quién debe haber emitido el token. Es la dirección con la que el NAVEGADOR llega a
#    Keycloak, porque esa es la que Keycloak escribe en el token (campo "iss").
#  - jwk-set-uri: dónde descargar la llave pública para comprobar la firma. Dentro de Docker es otra
#    dirección (http://keycloak:8080/...), por eso se configuran por separado.
# La llave se descarga con la primera petición que trae token, no al arrancar: Catálogo arranca
# aunque Keycloak todavía no esté listo.
spring.security.oauth2.resourceserver.jwt:
  issuer-uri: ${KEYCLOAK_EMISOR:http://localhost:8180/realms/tienda}
  jwk-set-uri: ${KEYCLOAK_LLAVES:http://localhost:8180/realms/tienda/protocol/openid-connect/certs}
